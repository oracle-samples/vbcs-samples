<div class="oj-sm-padding-2x oj-md-padding-8x recipe-desc">

  <p>This recipe shows you how to configure two Dynamic Tables so that you can drag rows from one table and drop them in the other table. </p>
</div>

<div class="oj-flex oj-md-margin-8x-start oj-md-margin-8x-end sample-box">
  <div class="oj-sm-flex-direction-column sample-box2" style="width:100%;">
    <h4 class="oj-flex-item oj-sm-flex-initial">Select the row(s) then click and drag the row(s)</h4>
    <div class="oj-flex">
      <oj-dynamic-table class="oj-flex-item oj-sm-12 oj-md-12" data="[[$variables.employeeListSDP]]"
        metadata="[[ $metadata.businessObjectsGetallEmployeeMetadata.provider ]]" layout="tableExampleLayout"
        style="height: 200px" selection-mode.row="multiple" dnd.drag.rows.data-types="application/ojtablerows+json"
        id="drag-table"></oj-dynamic-table>
    </div>

    <h4 class="oj-flex-item oj-sm-flex-initial">Drop the rows below</h4>
    <div class="oj-flex-item">
      <oj-dynamic-table class="oj-flex-item oj-sm-12 oj-md-12" data="[[ $variables.employeeDropListADP ]]"
        metadata="[[ $metadata.businessObjectsGetallEmployeeMetadata.provider ]]" layout="tableExampleLayout"
        style="height:200px" dnd.drop.rows.data-types="application/ojtablerows+json"
        dnd.drop.rows.drop="[[$functions.handleDropRows]]" id="drop-table"></oj-dynamic-table>
    </div>
  </div>
</div>

<oj-bind-if test="[[ $application.variables.isThisVBDesigner === false ]]">
  <div class="oj-flex oj-sm-flex-1 oj-md-flex-1"
    :style.min-width="[[ $application.responsive.smOnly ? '360px' : '500px' ]]">
    <div class="recipe-box oj-bg-neutral-20 oj-flex-item">
      <h1 class="oj-typography-heading-lg">Recipe</h1>
      <div class="recipe-body oj-helper-overflow-wrap-anywhere">
        <oj-vb-content config="[[ vbRouterFlow ]]" class="oj-flex-item oj-sm-12 oj-md-12"></oj-vb-content>
      </div>
    </div>
  </div>
</oj-bind-if>
