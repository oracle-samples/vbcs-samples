<template id="template1">

      <oj-validation-group id="employee-validation-group--702936072-1">
        <oj-dyn-form metadata="[[ $metadata.businessObjectsUpdateEmployeeMetadata.provider ]]" layout="nameSection"
          value="{{ $variables.employee }}" value-loading="[[ $variables.employeeEditFormLoadingStatus ]]"
           operation="edit"
          id="oj-dyn-form-name-section"></oj-dyn-form>

  </oj-sp-section>
  
</template>
