<div class="oj-flex">
  <h1 class="oj-flex-item oj-sm-12 oj-md-12">Employee Detail</h1>
</div>
<div class="oj-flex">
  <div class="oj-flex-item oj-sm-12 oj-md-12">
    <oj-form-layout>
      <oj-input-number value="[[ $variables.employee.id ]]" readonly="true" label-hint="Id"></oj-input-number>
      <oj-input-text value="[[ $variables.employee.firstName ]]" readonly="true" label-hint="First Name"></oj-input-text>
      <oj-input-text value="[[ $variables.employee.lastName ]]" readonly="true" label-hint="Last Name"></oj-input-text>
    </oj-form-layout>
  </div>
</div>
<div class="oj-flex">
  <oj-toolbar chroming="solid" class="oj-flex-item oj-sm-12 oj-md-12">
    <oj-button label="Back" on-oj-action="[[$listeners.backButtonClicked]]"></oj-button>
  </oj-toolbar>
</div>
