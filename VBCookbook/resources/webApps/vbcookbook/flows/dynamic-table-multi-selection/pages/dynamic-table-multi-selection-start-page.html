<div class="oj-sm-padding-2x oj-md-padding-8x recipe-desc">

  This recipe shows you how to implement a Dynamic Table with multiple row selection, and how to programmatically
  control row selection. It uses <code>getEnhancedDataProvider</code> to cache data, so selected rows can be fetched
  from an in-memory
  cache to avoid unnecessary REST calls.

</div>
<div class="oj-flex oj-md-margin-8x-start oj-md-margin-8x-end sample-box ">
  <div class="oj-sm-flex-direction-column sample-box2" style="width: 100%">
    <oj-button label="Deselect All" on-oj-action="[[$listeners.onDeselectAllButtonAction]]"></oj-button>
    <oj-button label="Select Employees with IDs 1 and 3"
      on-oj-action="[[$listeners.onSelectSpecificRowsAction]]"></oj-button>
    <oj-dynamic-table class="oj-table-stretch oj-flex-item" data="[[$page.variables.enhancedDP]]"
      metadata="[[ $page.metadata.businessObjectsGetallEmployeeMetadata.provider ]]" layout="tableExampleLayout"
      style="height: 400px; min-width: 60vw; width: 100%" :id="[['dynamic-table-field-template']]"
      selection-mode.row="multiple" on-selected-changed="[[$listeners.dynamicTableFieldTemplateSelected]]"
      selected="{{ $variables.selectedRows }}">
    </oj-dynamic-table>


    <oj-text-area class="oj-flex-item oj-sm-padding-1x" label-edge='provided' label-hint='Current Selection'
      value="{{ $variables.currentSelectionString }}" resize-behavior="vertical" rows="4"></oj-text-area>

  </div>

  <oj-bind-if test="[[ $application.variables.isThisVBDesigner === false ]]">
    <div class="oj-flex oj-sm-flex-1 oj-md-flex-1"
      :style.min-width="[[ $application.responsive.smOnly ? '360px' : '500px' ]]">
      <div class="recipe-box oj-bg-neutral-20 oj-flex-item">
        <h1 class="oj-typography-heading-lg">Recipe</h1>
        <div class="recipe-body oj-helper-overflow-wrap-anywhere">
          <oj-vb-content config="[[ vbRouterFlow ]]" class="oj-flex-item oj-sm-12 oj-md-12"></oj-vb-content>
        </div>
      </div>
    </div>
  </oj-bind-if>
</div>
